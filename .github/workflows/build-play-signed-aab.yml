name: Build RideMesh Play-Signed AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-signed-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify signing secrets are configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing RIDEMESH_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RIDEMESH_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RIDEMESH_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RIDEMESH_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify second-group feature is absent
        shell: bash
        run: |
          ! grep -R "secondaryInternetNode\|SECONDARY GROUP\|CREATE SECOND GROUP\|JOIN SECOND GROUP" app/src/main/java app/src/main/res/layout/activity_main.xml

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ridemesh-upload.jks"
          test -s "$RUNNER_TEMP/ridemesh-upload.jks"
          chmod 600 "$RUNNER_TEMP/ridemesh-upload.jks"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Sign AAB with RideMesh upload key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/ridemesh-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB" | tee "$RUNNER_TEMP/aab-verify.txt"
          grep -qi "jar verified" "$RUNNER_TEMP/aab-verify.txt"
          cp "$AAB" "RideMesh-Beta1.4-v0.4.8-PLAY-SIGNED.aab"

      - name: Upload Play-signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta1.4-v0.4.8-PLAY-SIGNED
          path: RideMesh-Beta1.4-v0.4.8-PLAY-SIGNED.aab
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta1.4-v0.4.8-play-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Remove upload keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ridemesh-upload.jks"
