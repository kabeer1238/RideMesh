name: RideMesh iOS Original Online Voice
on:
  workflow_dispatch:
  push:
    branches: [offline-mesh-v1]
    paths: ['ios/**', '.github/workflows/build-ios-hybrid.yml']
permissions:
  contents: read
concurrency:
  group: ios-hybrid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify original online source is unchanged
        run: shasum -a 256 -c tools/online-baseline.sha256
      - uses: actions/cache/restore@v4
        with:
          path: ios/build
          key: ios-native-v1-${{ runner.arch }}-${{ hashFiles('ios/project.yml') }}-${{ github.run_id }}
          restore-keys: ios-native-v1-${{ runner.arch }}-${{ hashFiles('ios/project.yml') }}-
      - name: Test retained offline protocol library (not enabled in iOS app)
        working-directory: ios
        run: |
          swiftc RideMeshIOS/Hybrid/HybridRouter.swift RideMeshIOS/Hybrid/HybridAudioRecovery.swift Tests/main.swift -o /tmp/hybrid-tests
          /tmp/hybrid-tests
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS device app without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RideMeshIOS.xcodeproj -scheme RideMeshIOS -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ios/build
          key: ios-native-v1-${{ runner.arch }}-${{ hashFiles('ios/project.yml') }}-${{ github.run_id }}
      - name: Package unsigned build and source
        working-directory: ios
        run: |
          ditto -c -k --keepParent build/Build/Products/Debug-iphoneos/RideMesh.app RideMesh-iOS-vc36-Online-UNSIGNED.zip
          zip -r RideMesh-iOS-vc36-Online-source.zip RideMeshIOS project.yml Tests README-HYBRID.md README-DISCOVERY-TEST.md
      - uses: actions/upload-artifact@v4
        with:
          name: RideMesh-iOS-vc36-Online-${{ github.run_number }}
          path: ios/RideMesh-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-build-log-${{ github.run_number }}
          path: ios/build.log
