name: Build RideMesh APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish latest test APK in repository
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RideMesh-v0.2.2-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/RideMesh-v0.2.2-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish RideMesh v0.2.2 test APK [skip ci]"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-v0.2.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
