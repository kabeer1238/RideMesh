name: Build RideMesh APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "beta1.3" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply Beta 1.3 approved UI and dual-group patch
        if: github.ref == 'refs/heads/beta1.3' || github.head_ref == 'beta1.3'
        run: |
          python3 tools/apply_beta13_patch.py
          python3 tools/fix_beta13_strings.py

      - name: Verify exact supplied RideMesh branding
        if: github.ref == 'refs/heads/beta1.3' || github.head_ref == 'beta1.3'
        shell: bash
        run: |
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          file app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          file app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp

      - name: Test, lint and build Beta 1.3
        id: compile
        shell: bash
        run: |
          set -o pipefail
          {
            echo "RideMesh Beta 1.3 CI $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $GITHUB_SHA"
            echo "=== UNIT TESTS ==="
            gradle --no-daemon testDebugUnitTest
            echo "=== ANDROID LINT ==="
            gradle --no-daemon lintDebug
            echo "=== APK BUILD ==="
            gradle --no-daemon assembleDebug
          } 2>&1 | tee build.log

      - name: Upload Beta 1.3 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta1.3-v0.4.7-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta1.3-v0.4.7-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Persist validated Beta 1.3 source
        if: success() && github.ref == 'refs/heads/beta1.3'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt \
            app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt \
            app/src/main/res/layout/activity_main.xml
          if ! git diff --cached --quiet; then
            git commit -m "Beta 1.3: validated dual-group UI and switching [skip ci]"
            git push origin beta1.3
          fi
