name: Build RideMesh Beta4.7 Smart Duck APK

on:
  workflow_dispatch:
  push:
    branches: [ "beta4.7-smart-duck-apk" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-smart-duck-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Internet voice runtime
        shell: bash
        run: |
          if grep -Fq 'Beta4 does not send PCM frames' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt && grep -Fq 'WEBRTC OPUS' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt; then
            echo 'Runtime already materialized'
          else
            python tools/apply_beta4_internet_only_ui.py
          fi

      - name: Apply public UI
        run: python tools/apply_beta43_public_ui.py

      - name: Apply Beta4.4 UX and fast presence
        run: python tools/apply_beta44_stability_speed.py

      - name: Apply stable vc12 crash fix
        run: python tools/apply_beta441_crashfix.py

      - name: Apply Beta4.5 unified theme and rider profile
        run: python tools/apply_beta45_themed_ui.py

      - name: Normalize generated Beta4.5 Kotlin
        run: python tools/fix_beta45_generated_kotlin.py

      - name: Apply Beta4.6 music coexistence
        run: python tools/apply_beta46_music_coexistence.py

      - name: Apply Beta4.7 active smart duck
        run: python tools/apply_beta47_smart_duck.py

      - name: Materialize RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify Beta4.7 configuration
        shell: bash
        run: |
          grep -Fq 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -Fq 'versionCode = 15' app/build.gradle.kts
          grep -Fq 'versionName = "1.0.0-beta4.7-smart-duck"' app/build.gradle.kts
          grep -Fq 'isMinifyEnabled = false' app/build.gradle.kts
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/main/AndroidManifest.xml
          grep -Fq 'AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq '.setWillPauseWhenDucked(false)' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'startSmartDucking()' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'collectVoiceActivity()' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'report.statsMap.values.any' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'members["audioLevel"]' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'manager.setStreamVolume(AudioManager.STREAM_MUSIC, target, 0)' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'SMART_DUCK_VOLUME_RATIO = 0.22' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'SMART_DUCK_HOLD_MS = 900L' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'audioJitterBufferMaxPackets = 50' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'pc.setBitrate(24_000, 40_000, 64_000)' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'showRideMeshPanel' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -Fq 'riderNameFromEmail' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Release lint
        run: gradle --no-daemon lintRelease

      - name: Build release APK only
        run: gradle --no-daemon assembleRelease

      - name: Align APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$APK"
          mkdir -p dist signing-tools/lib
          "$TOOLS/zipalign" -P 16 -f 4 "$APK" dist/RideMesh-Beta4.7-vc15-SmartDuck-ALIGNED-UNSIGNED.apk
          "$TOOLS/zipalign" -c -P 16 -v 4 dist/RideMesh-Beta4.7-vc15-SmartDuck-ALIGNED-UNSIGNED.apk > dist/ZIPALIGN-VERIFY.txt
          cp "$TOOLS/apksigner" signing-tools/apksigner
          cp "$TOOLS/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          sha256sum dist/RideMesh-Beta4.7-vc15-SmartDuck-ALIGNED-UNSIGNED.apk > dist/SHA256SUMS.txt

      - name: Upload Smart Duck APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta4.7-vc15-SmartDuck-Unsigned-APK
          path: dist/
          if-no-files-found: error

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-BuildTools-36-ApkSigner-Beta47
          path: signing-tools/
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta4.7-SmartDuck-Lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
