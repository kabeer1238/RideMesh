name: Build Rider Pillion Integration

on:
  push:
    branches: [ "rider-pillion-integration" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          if [ -f branding/ridemesh_logo.png.b64 ]; then base64 -d branding/ridemesh_logo.png.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo.png; fi
          if [ -f branding/ridemesh_icon.png.b64 ]; then base64 -d branding/ridemesh_icon.png.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon.png; fi
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Package APK
        shell: bash
        run: |
          mkdir -p package
          cp app/build/outputs/apk/debug/app-debug.apk package/RideMesh-Rider-Pillion-Integration.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Rider-Pillion-Integration
          path: package/RideMesh-Rider-Pillion-Integration.apk
          if-no-files-found: error
