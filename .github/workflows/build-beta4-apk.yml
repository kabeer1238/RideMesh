name: Build RideMesh Beta4 WebRTC Opus APK

on:
  workflow_dispatch:
  push:
    branches: [ "beta4-internet-webrtc-opus" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply Beta4 Internet-only UI/runtime patch
        run: python tools/apply_beta4_internet_only_ui.py

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify Beta4 identity and architecture
        shell: bash
        run: |
          grep -Fq 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -Fq 'versionCode = 7' app/build.gradle.kts
          grep -Fq 'versionName = "1.0.0-beta4-webrtc-opus"' app/build.gradle.kts
          grep -Fq 'io.github.webrtc-sdk:android:144.7559.09' app/build.gradle.kts
          grep -Fq 'WEBRTC OPUS' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'ridemesh/test/v3/' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'Beta4 does not send PCM frames' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -Fq 'transportMode = TransportMode.INTERNET_ONLY' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -Fq 'CALL / OTHER AUDIO ACTIVE • RIDEMESH PAUSED' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          grep -Fq 'DURATION_DAYS = 60L' app/src/main/java/com/bikemesh/ridemesh/beta/BetaWindow.kt
          if grep -Fq 'sendMqttPublish(audioTopic' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt; then
            echo 'ERROR: raw audio MQTT publishing still present'
            exit 1
          fi

      - name: Unit tests and Kotlin compile
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build installable Beta4 APK only
        run: gradle --no-daemon assembleDebug

      - name: Prepare tester APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/RideMesh-Beta4-WebRTC-Opus-Test.apk
          ls -lh dist/RideMesh-Beta4-WebRTC-Opus-Test.apk

      - name: Upload Beta4 tester APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta4-WebRTC-Opus-Test-APK
          path: dist/RideMesh-Beta4-WebRTC-Opus-Test.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta4-WebRTC-Opus-Lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Persist validated Beta4 source
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt \
                  app/src/main/res/layout/activity_main.xml \
                  app/src/main/java/com/bikemesh/ridemesh/service/RideService.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply Beta4 Internet-only WebRTC UI [skip ci]"
            git push origin HEAD:beta4-internet-webrtc-opus
          else
            echo "Validated Beta4 source already persisted"
          fi
