name: Build RideMesh Play AAB API 36

on:
  workflow_dispatch:
  push:
    branches: [ "play-release-api36" ]

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify Play release configuration
        shell: bash
        run: |
          grep -q 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-beta"' app/build.gradle.kts
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="microphone|connectedDevice"' app/src/main/AndroidManifest.xml
          ! grep -R "secondaryInternetNode\|SECONDARY GROUP\|CREATE SECOND GROUP\|JOIN SECOND GROUP" app/src/main/java app/src/main/res/layout/activity_main.xml

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Verify AAB created
        shell: bash
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          ls -lh "$AAB"

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Play-1.0.0-beta-api36-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Play-1.0.0-beta-api36-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
