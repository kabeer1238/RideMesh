name: Build RideMesh Beta4.3 Public Play RC AAB APK

on:
  workflow_dispatch:
  push:
    branches: [ "beta4.3-public-blackbox-email" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure validated Internet voice runtime
        shell: bash
        run: |
          if grep -Fq 'Beta4 does not send PCM frames' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt && \
             grep -Fq 'WEBRTC OPUS' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt; then
            echo 'Internet voice runtime already materialized; patch step skipped.'
          else
            python tools/apply_beta4_internet_only_ui.py
          fi

      - name: Apply Beta4.3 public black-box UI
        run: python tools/apply_beta43_public_ui.py

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify Beta4.3 public Play configuration
        shell: bash
        run: |
          grep -Fq 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -Fq 'compileSdk = 36' app/build.gradle.kts
          grep -Fq 'targetSdk = 36' app/build.gradle.kts
          grep -Fq 'versionCode = 10' app/build.gradle.kts
          grep -Fq 'versionName = "1.0.0-beta4.3-play"' app/build.gradle.kts
          grep -Fq 'isMinifyEnabled = true' app/build.gradle.kts
          grep -Fq 'USER_EMAIL_KEY' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -Fq 'Use 5–12 letters and numbers only' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -Fq 'BUG_REPORT_GROUP_URL' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -Fq 'DURATION_DAYS = 60L' app/src/main/java/com/bikemesh/ridemesh/beta/BetaWindow.kt
          if grep -Fq '+91 9188664823' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt; then
            echo 'ERROR: personal support phone remains in public UI source'
            exit 1
          fi
          if grep -Fq 'TURN relay:' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt || \
             grep -Fq 'Ride status • WebRTC + Opus' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt; then
            echo 'ERROR: engineering diagnostics remain in public status UI'
            exit 1
          fi
          if grep -Fq 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo 'ERROR: debuggable release manifest'
            exit 1
          fi
          for P in android.permission.BLUETOOTH_ADVERTISE android.permission.BLUETOOTH_SCAN android.permission.NEARBY_WIFI_DEVICES android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION; do
            if grep -Fq "$P" app/src/main/AndroidManifest.xml; then
              echo "ERROR: unused offline permission remains: $P"
              exit 1
            fi
          done

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Release lint
        run: gradle --no-daemon lintRelease

      - name: Build release AAB and APK
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Align and prepare unsigned release artifacts
        shell: bash
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          META="app/build/outputs/apk/release/output-metadata.json"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$AAB"
          test -s "$APK"
          test -s "$META"
          test -x "$TOOLS/zipalign"
          mkdir -p dist
          cp "$AAB" dist/RideMesh-Beta4.3-vc10-API36-UNSIGNED.aab
          "$TOOLS/zipalign" -P 16 -f 4 "$APK" dist/RideMesh-Beta4.3-vc10-API36-ALIGNED-UNSIGNED.apk
          "$TOOLS/zipalign" -c -P 16 -v 4 dist/RideMesh-Beta4.3-vc10-API36-ALIGNED-UNSIGNED.apk > dist/ZIPALIGN-VERIFY.txt
          cp "$META" dist/output-metadata.json
          sha256sum dist/RideMesh-Beta4.3-vc10-API36-UNSIGNED.aab dist/RideMesh-Beta4.3-vc10-API36-ALIGNED-UNSIGNED.apk > dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Prepare official Android APK signing tools
        shell: bash
        run: |
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -x "$TOOLS/apksigner"
          test -s "$TOOLS/lib/apksigner.jar"
          mkdir -p signing-tools/lib
          cp "$TOOLS/apksigner" signing-tools/apksigner
          cp "$TOOLS/lib/apksigner.jar" signing-tools/lib/apksigner.jar

      - name: Upload Beta4.3 unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta4.3-vc10-Release-Unsigned
          path: |
            dist/RideMesh-Beta4.3-vc10-API36-UNSIGNED.aab
            dist/RideMesh-Beta4.3-vc10-API36-ALIGNED-UNSIGNED.apk
            dist/output-metadata.json
            dist/ZIPALIGN-VERIFY.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload official APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-BuildTools-36-ApkSigner
          path: signing-tools/
          if-no-files-found: error

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta4.3-Release-Lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
