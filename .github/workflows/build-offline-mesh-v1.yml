name: RideMesh Cyan Offline Six Rider Test
on:
  workflow_dispatch:
  push:
    branches: [offline-mesh-v1]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-offline-mesh-v1.yml'
permissions:
  contents: read
concurrency:
  group: offline-six-rider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test canonical source
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build offline APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK signature
        run: |
          APK='app/build/outputs/apk/debug/RideMesh-offline6-vc32-debug.apk'
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RideMesh-vc32-Offline6-NoBilling-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
