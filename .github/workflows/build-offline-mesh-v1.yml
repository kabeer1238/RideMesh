name: Build RideMesh Offline Mesh v1 Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - offline-mesh-v1
    paths:
      - "app/**"
      - "tools/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-offline-mesh-v1.yml"

jobs:
  build-offline-mesh-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Materialize production vc25 runtime
        run: |
          python3 tools/apply_beta43_app_shell.py
          python3 tools/apply_beta44_settings.py
          python3 tools/apply_beta45_settings_help_qr.py
          python3 tools/apply_beta46_cluster_audio_map.py
          python3 tools/apply_beta47_cluster_engine.py
          python3 tools/apply_beta48_full_cluster_architecture.py
          python3 tools/apply_beta49_smart_group_voice.py
          python3 tools/apply_beta50_optimized_full_cluster.py
          python3 tools/apply_beta51_live_rider_map.py
          python3 tools/apply_beta52_google_maps.py
          python3 tools/apply_beta53_play_services_213.py
          python3 tools/apply_beta54_rider_clustering_bottom_sheet.py
          python3 tools/apply_beta55_subscription_paywall.py
          python3 tools/apply_production_vc25_billing8.py
          python3 tools/apply_production_no_beta_maps.py
          python3 tools/apply_production_final_cleanup.py
          python3 tools/fix_production_premium_enum.py
          python3 tools/enforce_production_premium_gate.py

      - name: Apply offline mesh v1
        run: |
          python3 tools/apply_offline_mesh_v1.py

      - name: Require Google Maps key
        env:
          RIDEMESH_MAPS_API_KEY: ${{ secrets.RIDEMESH_MAPS_API_KEY }}
        run: |
          test -n "$RIDEMESH_MAPS_API_KEY" || { echo "RIDEMESH_MAPS_API_KEY secret is required"; exit 1; }
          printf 'MAPS_API_KEY=%s\n' "$RIDEMESH_MAPS_API_KEY" > local.properties

      - name: Materialize branding
        run: |
          python3 tools/materialize_branding.py

      - name: Run unit tests
        run: |
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed debug test APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK signing
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RideMesh-vc25-OFFLINE-MESH-V1-INSTALLABLE-TEST.apk
          sha256sum dist/RideMesh-vc25-OFFLINE-MESH-V1-INSTALLABLE-TEST.apk > dist/SHA256SUMS.txt

      - name: Upload offline mesh test APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-vc25-Offline-Mesh-v1-Test-APK
          path: dist/
          if-no-files-found: error
