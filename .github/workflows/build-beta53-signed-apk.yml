name: Build RideMesh Beta5.3 vc22 Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ "beta5.3-compact-map-contacts-apk" ]

permissions:
  contents: read

env:
  MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build-signed-vc22-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require signing and Maps secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$MAPS_API_KEY" || (echo "Missing GOOGLE_MAPS_API_KEY" && exit 1)
          test -n "$KEYSTORE_B64" || (echo "Missing RIDEMESH_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RIDEMESH_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RIDEMESH_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RIDEMESH_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Apply RideMesh vc22 runtime
        shell: bash
        run: |
          if grep -Fq 'Beta4 does not send PCM frames' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt && grep -Fq 'WEBRTC OPUS' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt; then
            echo 'Runtime already materialized'
          else
            python tools/apply_beta4_internet_only_ui.py
          fi
          python tools/apply_beta43_public_ui.py
          python tools/apply_beta44_stability_speed.py
          python tools/apply_beta441_crashfix.py
          python tools/apply_beta45_themed_ui.py
          python tools/fix_beta45_generated_kotlin.py
          python tools/apply_beta46_music_coexistence.py
          python tools/apply_beta47_smart_duck.py
          python tools/apply_beta48_noise_aware_duck.py
          python tools/apply_beta49_battery_optimizations.py
          python tools/apply_beta50_adaptive_reliability.py
          python tools/fix_beta50_constants.py
          python tools/apply_beta51_live_rider_map.py
          python tools/fix_beta51_map_compile.py
          python tools/apply_beta52_clean_shutdown_map_visibility.py
          python tools/fix_beta52_constants.py
          python tools/apply_beta52_ios_location_compat.py
          python tools/apply_beta53_compact_contacts.py

      - name: Materialize RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify vc22 identity and features
        shell: bash
        run: |
          set -e
          grep -F 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -F 'versionCode = 22' app/build.gradle.kts
          grep -F 'versionName = "1.0.0-beta5.3-compact-map-contacts"' app/build.gradle.kts
          grep -F 'android:id="@+id/riderPhone"' app/src/main/res/layout/activity_main.xml
          grep -F 'val width = dp(132)' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -F 'showRiderCallOptions(location.phoneNumber)' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -F 'WHATSAPP CALL' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -F 'WHATSAPP MESSAGE' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -F 'decodeCanonicalRml1Location(payload)' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt

      - name: Restore RideMesh upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ridemesh-upload.jks"
          test -s "$RUNNER_TEMP/ridemesh-upload.jks"
          chmod 600 "$RUNNER_TEMP/ridemesh-upload.jks"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Release lint
        run: gradle --no-daemon lintRelease

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Align sign and verify vc22 APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/ridemesh-vc22-aligned.apk"
          OUT="dist/RideMesh-Beta5.3-vc22-CompactMapContacts-SIGNED.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -s "$UNSIGNED"
          mkdir -p dist
          "$TOOLS/zipalign" -P 16 -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/ridemesh-upload.jks" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" \
            "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee dist/APK_SIGNATURE_VERIFY.txt
          sha256sum "$OUT" > dist/SHA256SUMS.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$OUT" > dist/ZIPALIGN_VERIFY.txt

      - name: Upload installable vc22 APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta5.3-vc22-CompactMapContacts-SIGNED-APK
          path: |
            dist/RideMesh-Beta5.3-vc22-CompactMapContacts-SIGNED.apk
            dist/SHA256SUMS.txt
            dist/APK_SIGNATURE_VERIFY.txt
            dist/ZIPALIGN_VERIFY.txt
          if-no-files-found: error

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ridemesh-upload.jks" "$RUNNER_TEMP/ridemesh-vc22-aligned.apk"
