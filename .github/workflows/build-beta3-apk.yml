name: Build RideMesh Beta3 Low-Latency APK

on:
  workflow_dispatch:
  push:
    branches: [ "beta3-low-latency-audio" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply or validate Beta3 audio patch
        shell: bash
        run: |
          if grep -q 'versionName = "1.0.0-beta2"' app/build.gradle.kts; then
            python tools/apply_beta3_audio_patch.py
          else
            grep -q 'versionName = "1.0.0-beta3-audio"' app/build.gradle.kts
            grep -q 'private val sourceStates' app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt
            grep -q 'AudioRecord.READ_BLOCKING' app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt
          fi

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify Beta3 configuration
        shell: bash
        run: |
          grep -q 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 3' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-beta3-audio"' app/build.gradle.kts
          grep -q 'android:id="@+id/activeMute"' app/src/main/res/layout/activity_main.xml
          grep -q 'DURATION_DAYS = 60L' app/src/main/java/com/bikemesh/ridemesh/beta/BetaWindow.kt
          grep -q 'AudioRecord.READ_BLOCKING' app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt
          grep -q 'targetPrimeFrames' app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt
          grep -q 'concealFrame' app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt
          grep -q 'tcpNoDelay = true' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          ! grep -R "secondaryInternetNode\|SECONDARY GROUP\|CREATE SECOND GROUP\|JOIN SECOND GROUP" app/src/main/java app/src/main/res/layout/activity_main.xml

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build installable Beta3 APK only
        run: gradle --no-daemon assembleDebug

      - name: Prepare tester APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/RideMesh-Beta3-LowLatency-Audio-Test.apk
          ls -lh dist/RideMesh-Beta3-LowLatency-Audio-Test.apk

      - name: Upload Beta3 tester APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta3-LowLatency-Audio-Test-APK
          path: dist/RideMesh-Beta3-LowLatency-Audio-Test.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta3-LowLatency-Audio-Lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Persist validated Beta3 source
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt \
                  app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt \
                  app/src/main/java/com/bikemesh/ridemesh/mesh/MeshNode.kt \
                  app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply RideMesh Beta3 low-latency audio pipeline [skip ci]"
            git push origin HEAD:beta3-low-latency-audio
          else
            echo "Validated Beta3 source already persisted"
          fi
