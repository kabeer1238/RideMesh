name: Build RideMesh Beta5.4 vc23 Play-Signed AAB

on:
  workflow_dispatch:
  push:
    branches: [ "beta5.4-cluster-bottomsheet-apk" ]

permissions:
  contents: read

env:
  MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build-play-signed-vc23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify signing secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || (echo "Missing RIDEMESH_UPLOAD_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing RIDEMESH_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RIDEMESH_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RIDEMESH_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore and verify Play fingerprint
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ridemesh-upload.jks"
          chmod 600 "$RUNNER_TEMP/ridemesh-upload.jks"
          test -s "$RUNNER_TEMP/ridemesh-upload.jks"
          ACTUAL_SHA1=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/ridemesh-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" | awk '/SHA1:/{print $2; exit}')
          EXPECTED_SHA1='6B:69:2B:49:50:87:42:B9:88:B0:76:52:67:6E:DA:87:C9:68:65:C9'
          echo "Configured upload certificate SHA-1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || (echo "Configured upload key does not match the Play Console upload certificate" && exit 1)

      - name: Materialize RideMesh vc23 runtime
        shell: bash
        run: |
          set -e
          if grep -Fq 'Beta4 does not send PCM frames' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt && grep -Fq 'WEBRTC OPUS' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt; then
            echo 'Runtime already materialized'
          else
            python tools/apply_beta4_internet_only_ui.py
          fi
          python tools/apply_beta43_public_ui.py
          python tools/apply_beta44_stability_speed.py
          python tools/apply_beta441_crashfix.py
          python tools/apply_beta45_themed_ui.py
          python tools/fix_beta45_generated_kotlin.py
          python tools/apply_beta46_music_coexistence.py
          python tools/apply_beta47_smart_duck.py
          python tools/apply_beta48_noise_aware_duck.py
          python tools/apply_beta49_battery_optimizations.py
          python tools/apply_beta50_adaptive_reliability.py
          python tools/fix_beta50_constants.py
          python tools/apply_beta51_live_rider_map.py
          python tools/fix_beta51_map_compile.py
          python tools/apply_beta52_clean_shutdown_map_visibility.py
          python tools/fix_beta52_constants.py
          python tools/apply_beta52_ios_location_compat.py
          python tools/apply_beta53_compact_contacts.py
          python tools/apply_beta54_cluster_bottomsheet.py
          python tools/fix_beta54_generated_kotlin.py

      - name: Require Google Maps key
        shell: bash
        run: test -n "$MAPS_API_KEY" || (echo "GOOGLE_MAPS_API_KEY is required" && exit 1)

      - name: Materialize branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify vc23 identity
        shell: bash
        run: |
          set -e
          grep -F 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -F 'versionCode = 23' app/build.gradle.kts
          grep -F 'versionName = "1.0.0-beta5.4-cluster-bottomsheet"' app/build.gradle.kts
          grep -F 'private val riderClusterMarkers' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt
          grep -F 'VIEW DETAILS' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Release lint
        run: gradle --no-daemon lintRelease

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Sign and verify Google Play AAB
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist
          AAB='app/build/outputs/bundle/release/app-release.aab'
          OUT='dist/RideMesh-Beta5.4-vc23-ClusterBottomSheet-GOOGLE-PLAY-SIGNED.aab'
          test -s "$AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/ridemesh-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB" > dist/AAB-SIGNATURE-VERIFY.txt
          grep -qi 'jar verified' dist/AAB-SIGNATURE-VERIFY.txt
          cp "$AAB" "$OUT"
          unzip -p "$OUT" 'META-INF/*.RSA' > "$RUNNER_TEMP/aab-cert.rsa"
          keytool -printcert -file "$RUNNER_TEMP/aab-cert.rsa" > dist/AAB-CERTIFICATE.txt
          grep -F '6B:69:2B:49:50:87:42:B9:88:B0:76:52:67:6E:DA:87:C9:68:65:C9' dist/AAB-CERTIFICATE.txt
          sha256sum "$OUT" > dist/SHA256SUMS.txt

      - name: Upload signed vc23 AAB
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-Beta5.4-vc23-Google-Play-SIGNED-AAB
          path: dist/
          if-no-files-found: error

      - name: Remove upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ridemesh-upload.jks" "$RUNNER_TEMP/aab-cert.rsa"
