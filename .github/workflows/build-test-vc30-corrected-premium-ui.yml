name: Build RideMesh vc30 TEST Corrected Premium UI

on:
  workflow_dispatch:
  push:
    branches: [ "test-vc30-corrected-premium-ui" ]

permissions:
  contents: read

env:
  MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  build-vc30-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Materialize vc25 production baseline
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'Beta4 does not send PCM frames' app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt && grep -Fq 'WEBRTC OPUS' app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt; then
            echo 'Beta4 runtime already materialized'
          else
            python tools/apply_beta4_internet_only_ui.py
          fi
          python tools/apply_beta43_public_ui.py
          python tools/apply_beta44_stability_speed.py
          python tools/apply_beta441_crashfix.py
          python tools/apply_beta45_themed_ui.py
          python tools/fix_beta45_generated_kotlin.py
          python tools/apply_beta46_music_coexistence.py
          python tools/apply_beta47_smart_duck.py
          python tools/apply_beta48_noise_aware_duck.py
          python tools/apply_beta49_battery_optimizations.py
          python tools/apply_beta50_adaptive_reliability.py
          python tools/fix_beta50_constants.py
          python tools/apply_beta51_live_rider_map.py
          python tools/fix_beta51_map_compile.py
          python tools/apply_beta52_clean_shutdown_map_visibility.py
          python tools/fix_beta52_constants.py
          python tools/apply_beta52_ios_location_compat.py
          python tools/apply_beta53_compact_contacts.py
          python tools/apply_beta54_cluster_bottomsheet.py
          python tools/fix_beta54_generated_kotlin.py
          python tools/apply_beta55_subscription_paywall.py
          python tools/apply_production_vc25_billing8.py
          python tools/apply_production_no_beta.py
          python tools/apply_production_final_cleanup.py
          python tools/fix_production_premium_enum.py

      - name: Apply vc26 Active UI and 8-rider audio optimization
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/apply_production_vc26_active_ui_8rider.py.gz.b64 | gzip -d > /tmp/apply_vc26.py
          python /tmp/apply_vc26.py

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Apply vc28 TEST no-billing bypass
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_test_vc28_vc26_ui_no_billing.py

      - name: Download photographic UI test assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi

          # Dark all-black motorcycle rider/helmet photograph by Nick van der Vegt — Unsplash.
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.unsplash.com/photo-1611004060674-7e8864bcb4e4?auto=format&fit=crop&fm=jpg&q=82&w=1000&h=1050' \
            -o app/src/main/res/drawable-nodpi/vc30_active_rider_photo.jpg

          # Mountain highway / long-exposure road photograph by 張 峻嘉 — Unsplash.
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://images.unsplash.com/photo-1503505344463-859206198e4b?auto=format&fit=crop&fm=jpg&q=84&w=1080&h=1920' \
            -o app/src/main/res/drawable-nodpi/vc30_splash_road.jpg

          test "$(stat -c%s app/src/main/res/drawable-nodpi/vc30_active_rider_photo.jpg)" -gt 20000
          test "$(stat -c%s app/src/main/res/drawable-nodpi/vc30_splash_road.jpg)" -gt 20000
          file app/src/main/res/drawable-nodpi/vc30_active_rider_photo.jpg
          file app/src/main/res/drawable-nodpi/vc30_splash_road.jpg

      - name: Apply vc30 corrected premium UI
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_test_vc30_corrected_premium_ui.py

      - name: Verify vc30 identity visuals and safeguards
        shell: bash
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt"
          NET="app/src/main/java/com/bikemesh/ridemesh/transport/InternetNode.kt"
          LAYOUT="app/src/main/res/layout/activity_main.xml"
          SPLASH="app/src/main/java/com/bikemesh/ridemesh/SplashActivity.kt"

          grep -F 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -F 'versionCode = 30' app/build.gradle.kts
          grep -F 'versionName = "1.0.1-test30"' app/build.gradle.kts
          grep -F 'VC28_TEST_NO_BILLING_GATE' "$MAIN"
          grep -F 'VC28_TEST_NO_BILLING_PAYWALL_DISABLED' "$MAIN"
          grep -F 'VC30_HELMET_AVATAR_STYLE' "$MAIN"
          grep -F '@drawable/vc30_active_photo_background' "$LAYOUT"
          grep -F 'RIDE ACTIVE' "$LAYOUT"
          grep -F 'HANDS-FREE INTERCOM' "$LAYOUT"
          grep -F 'RIDE TOGETHER' "$SPLASH"
          grep -F 'STAY CONNECTED' "$SPLASH"
          grep -F 'vc30_splash_road' "$SPLASH"
          test -s app/src/main/res/drawable/ic_vc30_rider_helmet.xml
          test -s app/src/main/res/drawable/vc30_active_photo_background.xml
          test -s app/src/main/res/drawable-nodpi/vc30_active_rider_photo.jpg
          test -s app/src/main/res/drawable-nodpi/vc30_splash_road.jpg
          grep -F 'MAX_VISIBLE_RIDER_TILES = 8' "$MAIN"
          grep -F 'MAX_REMOTE_RIDERS = 7' "$NET"
          grep -F 'usedtx=1' "$NET"
          grep -F 'useinbandfec=1' "$NET"
          grep -F 'maxaveragebitrate=56000' "$NET"

          # Reject both previously rejected UI directions.
          if grep -Fq 'VC27 TEST RIDER DASHBOARD' "$LAYOUT"; then
            echo 'ERROR: rejected vc27 dashboard leaked into vc30'
            exit 1
          fi
          if grep -R -Fq 'vc29_helmet_rider_silhouette' app/src/main; then
            echo 'ERROR: rejected vc29 flat helmet background leaked into vc30'
            exit 1
          fi
          test -n "$MAPS_API_KEY" || (echo 'GOOGLE_MAPS_API_KEY is required' && exit 1)

      - name: Resolve dependencies
        run: gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > /tmp/ridemesh-deps-vc30.txt

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Release lint
        run: gradle --no-daemon lintRelease

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Restore upload signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RIDEMESH_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || (echo 'Missing RIDEMESH_UPLOAD_KEYSTORE_B64' && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ridemesh-upload.jks"
          test -s "$RUNNER_TEMP/ridemesh-upload.jks"
          chmod 600 "$RUNNER_TEMP/ridemesh-upload.jks"

      - name: Sign installable vc30 TEST APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEMESH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEMESH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mkdir -p dist
          test -s "$APK"
          "$TOOLS/zipalign" -P 16 -f 4 "$APK" "$RUNNER_TEMP/ridemesh-vc30-test-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/ridemesh-upload.jks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out dist/RideMesh-v1.0.1-vc30-TEST-CorrectedPremiumUI-NoBilling-INSTALLABLE-SIGNED.apk "$RUNNER_TEMP/ridemesh-vc30-test-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/RideMesh-v1.0.1-vc30-TEST-CorrectedPremiumUI-NoBilling-INSTALLABLE-SIGNED.apk | tee "$RUNNER_TEMP/apk-verify-vc30.txt"

      - name: Build delivery package
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/README.txt <<'TXT'
          RideMesh 1.0.1-test30 (Build 30 TEST)

          CLEAN BASE
          - Built from approved vc28/vc26 Active Ride UI.
          - vc27 dashboard redesign is not included.
          - vc29 flat/vector helmet background is not included.

          CORRECTED VISUALS
          - Real photographic motorcycle rider/helmet background with heavy black fade.
          - Cinematic mountain-road splash screen with RideMesh logo, tagline, build number and progress animation.
          - Full-face helmet silhouette rider avatars instead of one-letter badges.

          TEST BEHAVIOR
          - Google Play billing/paywall bypassed for field testing only.
          - vc26 8-rider WebRTC/Opus tuning retained.
          - Do NOT publish this TEST build to Google Play production.
          TXT

          cat > dist/ASSET-CREDITS.txt <<'TXT'
          TEST VISUAL ASSETS — Unsplash License

          Active Ride rider/helmet photograph:
          Nick van der Vegt — https://unsplash.com/photos/p7btNCbXKPQ

          Splash mountain highway photograph:
          張 峻嘉 — https://unsplash.com/photos/uG0k37LBQUM

          These assets are used in vc30 TEST for UI evaluation. Final production artwork can be replaced before Play Store release if desired.
          TXT

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload vc30 TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-v1.0.1-vc30-TEST-CorrectedPremiumUI-NoBilling-APK
          path: dist/
          if-no-files-found: error

      - name: Cleanup signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ridemesh-upload.jks" "$RUNNER_TEMP/ridemesh-vc30-test-aligned.apk"
