name: Build RideMesh Beta2 Pack API 36

on:
  workflow_dispatch:
  push:
    branches: [ "beta2-mute-expiry-ui" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate approved Beta2 UI mute expiry source
        run: python tools/apply_beta2_mute_expiry_patch.py

      - name: Materialize approved RideMesh branding
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/ridemesh_logo_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          base64 -d branding/ridemesh_icon_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          base64 -d branding/ridemesh_boot_exact.webp.b64 > app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_logo_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_icon_exact.webp
          test -s app/src/main/res/drawable-nodpi/ridemesh_boot_exact.webp

      - name: Verify Beta2 release configuration
        shell: bash
        run: |
          grep -q 'applicationId = "in.autopilotindia.ridemesh"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-beta2"' app/build.gradle.kts
          grep -q 'android:id="@+id/activeMute"' app/src/main/res/layout/activity_main.xml
          grep -q 'BETA ACCESS' app/src/main/res/layout/activity_main.xml
          grep -q 'android:text="READY TO RIDE"' app/src/main/res/layout/activity_main.xml
          grep -q 'DURATION_DAYS = 60L' app/src/main/java/com/bikemesh/ridemesh/beta/BetaWindow.kt
          grep -q 'setUserMuted' app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="microphone|connectedDevice"' app/src/main/AndroidManifest.xml
          ! grep -R "secondaryInternetNode\|SECONDARY GROUP\|CREATE SECOND GROUP\|JOIN SECOND GROUP" app/src/main/java app/src/main/res/layout/activity_main.xml

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build installable test APK + release APK + AAB
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Verify artifacts
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload Beta2 install pack
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-1.0.0-beta2-api36-install-pack
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideMesh-1.0.0-beta2-api36-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Persist validated Beta2 source
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/bikemesh/ridemesh/MainActivity.kt \
                  app/src/main/java/com/bikemesh/ridemesh/audio/AudioEngine.kt \
                  app/src/main/java/com/bikemesh/ridemesh/beta/BetaWindow.kt \
                  app/src/main/res/layout/activity_main.xml \
                  app/src/test/java/com/bikemesh/ridemesh/beta/BetaWindowTest.kt
          if git diff --cached --quiet; then
            echo "Validated Beta2 source already persisted"
          else
            git commit -m "Apply RideMesh 1.0.0-beta2 approved UI, mute and 60-day expiry"
            git push origin HEAD:beta2-mute-expiry-ui
          fi
